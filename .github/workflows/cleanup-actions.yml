name: Cleanup old GitHub Actions runs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulasi saja; tidak menghapus apa pun"
        type: boolean
        required: true
        default: true
      keep_latest:
        description: "Jumlah run terbaru yang dipertahankan untuk setiap workflow"
        type: number
        required: true
        default: 10
      confirmation:
        description: 'Wajib isi DELETE_OLD_RUNS jika dry_run dimatikan'
        type: string
        required: false
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Audit and selectively delete old workflow runs
    runs-on: ubuntu-24.04
    steps:
      - name: Preview and optionally delete obsolete runs
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP_LATEST: ${{ inputs.keep_latest }}
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const dryRun = String(process.env.DRY_RUN).toLowerCase() !== "false";
            const keepLatest = Number(process.env.KEEP_LATEST || 10);
            const confirmation = process.env.CONFIRMATION || "";
            const protectedRunIds = new Set([
              42585458230, // NVK #102: retained historical checkpoint
              42596406918, // NVK #112: retained diagnostic build
              42598302665, // NVK #115: instrumentation checkpoint
              42599827000, // NVK #116: verified trace instrumentation
              42604872518, // NVK #118: finish_create tracing build
            ]);
            const targetBranch = "work/switch-libnx-platform";

            if (!Number.isInteger(keepLatest) || keepLatest < 1 || keepLatest > 100) {
              core.setFailed("keep_latest must be an integer from 1 to 100.");
              return;
            }
            if (!dryRun && confirmation !== "DELETE_OLD_RUNS") {
              core.setFailed("Deletion blocked: set confirmation exactly to DELETE_OLD_RUNS.");
              return;
            }

            const { owner, repo } = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const branchRuns = runs.filter(run =>
              run.head_branch === targetBranch &&
              run.status === "completed"
            );

            const byWorkflow = new Map();
            for (const run of branchRuns) {
              const key = String(run.workflow_id);
              if (!byWorkflow.has(key)) byWorkflow.set(key, []);
              byWorkflow.get(key).push(run);
            }

            const keepIds = new Set(protectedRunIds);
            for (const workflowRuns of byWorkflow.values()) {
              workflowRuns.sort((a, b) =>
                new Date(b.created_at).getTime() - new Date(a.created_at).getTime()
              );
              for (const run of workflowRuns.slice(0, keepLatest)) {
                keepIds.add(run.id);
              }
            }

            const candidates = branchRuns.filter(run => !keepIds.has(run.id));
            const summary = [
              "# GitHub Actions cleanup",
              "",
              `- Mode: **${dryRun ? "DRY RUN — no deletion" : "DELETE"}**`,
              `- Scanned repository runs: **${runs.length}** (all pages)`,
              `- Completed runs on ${targetBranch}: **${branchRuns.length}**`,
              `- Retention: latest **${keepLatest}** per workflow`,
              `- Explicitly protected milestone IDs: **${protectedRunIds.size}**`,
              `- Candidates: **${candidates.length}**`,
              "",
              "| Run | Workflow | Conclusion | Created | Decision |",
              "|---:|---|---|---|---|",
              ...branchRuns
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                .map(run => `| [#${run.run_number}](${run.html_url}) | ${run.name} | ${run.conclusion} | ${run.created_at} | ${keepIds.has(run.id) ? "KEEP" : "DELETE CANDIDATE"} |`)
            ];
            core.summary.addRaw(summary.join("\n")).addEOL();
            await core.summary.write();

            core.info(`Scanned ${runs.length} runs; ${branchRuns.length} completed runs on target branch; ${candidates.length} candidates.`);
            if (dryRun) {
              core.notice("Dry run only. No workflow runs were deleted. Review the job summary, then rerun with dry_run=false and confirmation=DELETE_OLD_RUNS.");
              return;
            }

            let deleted = 0;
            const errors = [];
            for (const run of candidates) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: run.id
                });
                deleted++;
                core.info(`Deleted run #${run.run_number} (${run.id}) — ${run.name}`);
              } catch (error) {
                errors.push({ id: run.id, run: run.run_number, message: error.message });
                core.warning(`Could not delete run #${run.run_number} (${run.id}): ${error.message}`);
              }
            }

            core.summary.addHeading("Deletion result");
            core.summary.addRaw(`- Deleted: **${deleted}**\n- Failed: **${errors.length}**`).addEOL();
            if (errors.length) core.setFailed(`${errors.length} workflow runs could not be deleted.`);
