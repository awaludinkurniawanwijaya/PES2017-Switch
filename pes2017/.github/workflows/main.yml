name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ctest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libvulkan-dev
      - name: Configure (tests only, no game files needed)
        run: cmake -S tests -B build-tests -G Ninja
      - name: Build
        run: cmake --build build-tests
      - name: Run
        run: ctest --test-dir build-tests --output-on-failure
